name: Render Keep-Alive Ping

on:
  schedule:
    # Triggers every 10 minutes to keep Render free tier awake (Render sleeps after 15 min)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual one-click trigger from the Actions tab

jobs:
  keep-alive:
    name: Ping Avenqra AI Service
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Ping to /health
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" https://medlens-ai-v3ru.onrender.com/health)
          HTTP_BODY=$(echo "$RESPONSE" | head -n 1)
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
          echo "Endpoint response: $HTTP_BODY (HTTP $HTTP_STATUS)"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Success: Avenqra AI service is warm and operational."
          else
            echo "Ping delivered with status $HTTP_STATUS."
          fi
