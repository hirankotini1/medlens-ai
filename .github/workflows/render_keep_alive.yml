name: Render Keep-Alive Ping

on:
  # Scheduled execution every 10 minutes to prevent Render free-tier spin-down
  schedule:
    - cron: '*/10 * * * *'
  # Manual execution trigger from GitHub Actions UI ("Run workflow")
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Avenqra AI Service
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Ping to /health
        run: |
          RESPONSE=$(curl -sSL --max-time 30 -w "\n%{http_code}" https://medlens-ai-v3ru.onrender.com/health)
          HTTP_BODY=$(echo "$RESPONSE" | head -n 1)
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
          echo "Endpoint response: $HTTP_BODY (HTTP $HTTP_STATUS)"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Success: Avenqra AI service is warm and operational."
          else
            echo "Error: Keep-alive ping failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
