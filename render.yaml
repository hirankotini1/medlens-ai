services:
  - type: web
    name: medlens-ai
    runtime: python
    region: singapore
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn disease_prediction.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # ── Supabase PostgreSQL (Hospital ERP) ────────────────────────────────
      # Set actual values in Render Dashboard → Environment
      - key: SUPABASE_DB_HOST
        sync: false
      - key: SUPABASE_DB_PORT
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_DB_NAME
        sync: false

      # ── OpenRouter AI ─────────────────────────────────────────────────────
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-4-31b-it:free
      - key: OPENROUTER_SITE_URL
        fromService:
          type: web
          name: medlens-ai
          property: host
      - key: OPENROUTER_APP_NAME
        value: Avenqra AI Health Assistant

      # ── Authentication Secrets ────────────────────────────────────────────
      - key: PATHOLOGY_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

      # ── SMS Gateway ───────────────────────────────────────────────────────
      - key: SMS_GATEWAY_TOKEN_SECRET
        sync: false
      - key: ADMIN_GATEWAY_TOKEN
        sync: false
      - key: SMS_GATEWAY_ENABLED
        value: "true"
      - key: SMS_DAILY_LIMIT
        value: "100"
